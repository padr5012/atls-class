    <h1>Open tunings</h1>

    <p>Guitars can be tuned in many nonstandard ways, and one of them is the <strong>open tuning</strong>. In an open tuning, when you strum without pressing any frets, it still makes a chord. Artists such as <a href="https://jonimitchell.com/Music/tuningpatterns.cfm">Joni Mitchell</a> and <a href="https://tabs.ultimate-guitar.com/tab/elliott-smith/clementine-tabs-1190177">Elliot Smith</a> use them frequently.</p>
